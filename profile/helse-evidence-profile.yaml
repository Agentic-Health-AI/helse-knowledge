profile:
  id: https://github.com/Agentic-Health-AI/helse-knowledge/profile/0.1
  name: Helse Evidence Profile
  version: "0.1-proposed"
  status: proposed-for-freeze
  namespace: helse_evidence

extends:
  okf_pin_id: https://github.com/Agentic-Health-AI/helse-knowledge/profile/pins/okf-0.2/1
  local_pin_path: okf-0.2-pin.yaml

schemas:
  version: "0.1"
  directory: ../schemas
  records:
    - search-run
    - discovery
    - screening
    - relation-study-identity
    - extraction
    - verification-event
    - synthesis
    - claim

canonical_formats:
  concepts: markdown
  corpora: jsonl
  profile_and_schemas: yaml
  generated_artifacts_are_canonical: false

verification:
  human_events_require_actual_human_review: true
  stable_claim_from_preprints_only: forbidden
  personal_health_data: forbidden
  machine_may_only_propose: true
