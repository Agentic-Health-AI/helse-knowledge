profile:
  id: https://github.com/Agentic-Health-AI/helse-knowledge/profile/0.1
  name: Helse Evidence Profile
  version: "0.1-frozen-pilot"
  status: frozen-for-pilot
  namespace: helse_evidence

extends:
  okf_pin_id: https://github.com/Agentic-Health-AI/helse-knowledge/profile/pins/okf-0.2/1
  local_pin_path: okf-0.2-pin.yaml

schemas:
  version: "0.1"
  directory: ../schemas
  records:
    - search-run
    - discovery
    - screening
    - relation-study-identity
    - extraction
    - verification-event
    - synthesis
    - claim

canonical_formats:
  concepts: markdown
  corpora: jsonl
  profile_and_schemas: yaml
  generated_artifacts_are_canonical: false

verification:
  semantic_engine: source-bound-llm
  human_approval_gates: forbidden
  material_fields_require_source_spans: true
  parser_output_requires_independent_audit: true
  unsupported_or_conflicting_result: unresolved
  stable_claim_from_preprints_only: forbidden
  personal_health_data: forbidden
